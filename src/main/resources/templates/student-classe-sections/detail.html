<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Chi tiết phân lớp HP', 'sections', ~{:: .main-layout})}">
<body>
<div class="main-layout">
<div style="width:100%;max-width:900px;">

  <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1.5rem;font-size:0.85rem;color:#9ca3af;">
    <a href="/student-classe-sections" style="color:#0891b2;text-decoration:none;font-weight:600;">Phân lớp HP</a>
    <i class="bi bi-chevron-right" style="font-size:0.7rem;"></i>
    <span>Chi tiết phân lớp</span>
  </div>

  <!-- Hero -->
  <div style="background:linear-gradient(135deg,#0891b2,#06b6d4);border-radius:20px;padding:2rem;margin-bottom:1.5rem;box-shadow:0 8px 30px rgba(8,145,178,0.3);position:relative;overflow:hidden;">
    <div style="position:absolute;top:-30px;right:-30px;width:180px;height:180px;background:rgba(255,255,255,0.07);border-radius:50%;"></div>
    <div style="display:flex;align-items:center;gap:1.5rem;position:relative;z-index:1;">
      <div style="width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff;flex-shrink:0;border:3px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.2);"
           th:text="${section.studentFullName != null and !section.studentFullName.isEmpty() ? #strings.substring(section.studentFullName,0,1) : 'S'}"></div>
      <div style="flex:1;">
        <div th:text="${section.studentFullName ?: 'Phân lớp HP'}" style="font-size:1.6rem;font-weight:800;color:#fff;"></div>
        <div style="display:flex;align-items:center;gap:0.75rem;margin-top:0.4rem;">
          <span th:text="${section.studentCode ?: '—'}" style="background:rgba(255,255,255,0.2);color:#fff;padding:3px 12px;border-radius:20px;font-family:monospace;font-weight:700;font-size:0.9rem;"></span>
          <span th:text="${section.studentClasseCode ?: '—'}" style="background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.9);padding:3px 12px;border-radius:20px;font-size:0.8rem;font-weight:600;"></span>
        </div>
      </div>
      <div style="display:flex;gap:0.75rem;">
        <a th:href="@{/student-classe-sections/{id}/edit(id=${section.id})}"
           style="display:flex;align-items:center;gap:0.5rem;padding:0.65rem 1.25rem;background:rgba(255,255,255,0.2);color:#fff;border:1.5px solid rgba(255,255,255,0.4);border-radius:10px;text-decoration:none;font-weight:700;font-size:0.875rem;"
           onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">
          <i class="bi bi-pencil-square"></i> Chỉnh sửa
        </a>
        <a href="/student-classe-sections"
           style="display:flex;align-items:center;gap:0.5rem;padding:0.65rem 1.25rem;background:rgba(0,0,0,0.15);color:rgba(255,255,255,0.85);border:1.5px solid rgba(255,255,255,0.2);border-radius:10px;text-decoration:none;font-weight:600;font-size:0.875rem;"
           onmouseover="this.style.background='rgba(0,0,0,0.25)'" onmouseout="this.style.background='rgba(0,0,0,0.15)'">
          <i class="bi bi-arrow-left"></i> Danh sách
        </a>
      </div>
    </div>
  </div>

  <!-- Info Grid -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem;">
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.25rem;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:0.65rem;background:linear-gradient(90deg,#ecfeff,#f0fdfe); border-bottom:1px solid #e5e7eb;">
        <div style="width:32px;height:32px;background:linear-gradient(135deg,#ecfeff,#cffafe);color:#0891b2;border-radius:8px;display:flex;align-items:center;justify-content:center;"><i class="bi bi-link-45deg"></i></div>
        <span style="font-weight:700;font-size:0.9rem;color:#111827;">Thông tin liên kết</span>
      </div>
      <div style="padding:1.25rem;display:flex;flex-direction:column;gap:0.85rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid #f9fafb;">
          <span style="font-size:0.82rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.04em;">Mã sinh viên</span>
          <span th:text="${section.studentCode ?: '—'}" style="font-family:monospace;font-weight:700;color:#1d4ed8;background:#eff6ff;padding:3px 10px;border-radius:6px;font-size:0.85rem;"></span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid #f9fafb;">
          <span style="font-size:0.82rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.04em;">Họ tên SV</span>
          <span th:text="${section.studentFullName ?: '—'}" style="font-weight:700;color:#111827;font-size:0.875rem;"></span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;">
          <span style="font-size:0.82rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.04em;">Lớp hành chính</span>
          <span th:text="${section.studentClasseCode ?: '—'}" style="background:#ecfeff;color:#0e7490;padding:3px 10px;border-radius:6px;font-weight:700;font-size:0.82rem;"></span>
        </div>
      </div>
    </div>

    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.25rem;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:0.65rem;background:linear-gradient(90deg,#f8fffe,#f0fdf4); border-bottom:1px solid #e5e7eb;">
        <div style="width:32px;height:32px;background:linear-gradient(135deg,#e9f5ef,#d1fae5);color:#059669;border-radius:8px;display:flex;align-items:center;justify-content:center;"><i class="bi bi-info-circle"></i></div>
        <span style="font-weight:700;font-size:0.9rem;color:#111827;">Chi tiết phân lớp</span>
      </div>
      <div style="padding:1.25rem;display:flex;flex-direction:column;gap:0.85rem;">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid #f9fafb;">
          <span style="font-size:0.82rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.04em;">Trạng thái</span>
          <span th:text="${section.status ?: '—'}"
                th:style="${#strings.equalsIgnoreCase(section.status, 'Thôi học')} ? 'padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700;background:#fef2f2;color:#dc2626;border:1.5px solid #fecaca;white-space:nowrap;display:inline-block;'
                         : (${#strings.equalsIgnoreCase(section.status, 'Tốt nghiệp')} ? 'padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700;background:#fffbeb;color:#b45309;border:1.5px solid #fde68a;white-space:nowrap;display:inline-block;'
                         : (${#strings.equalsIgnoreCase(section.status, 'Bảo lưu')} ? 'padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700;background:#f5f3ff;color:#7c3aed;border:1.5px solid #ddd6fe;white-space:nowrap;display:inline-block;'
                         : (${#strings.equalsIgnoreCase(section.status, 'Đang học')} ? 'padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700;background:#f0fdf4;color:#15803d;border:1.5px solid #bbf7d0;white-space:nowrap;display:inline-block;'
                         : 'padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700;background:#f3f4f6;color:#374151;border:1.5px solid #e5e7eb;white-space:nowrap;display:inline-block;')))"></span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid #f9fafb;">
          <span style="font-size:0.82rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.04em;">Ngày bắt đầu</span>
          <span th:text="${section.startDate != null ? #temporals.format(section.startDate,'dd/MM/yyyy') : '—'}" style="color:#374151;font-size:0.875rem;"></span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;">
          <span style="font-size:0.82rem;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:0.04em;">Ghi chú</span>
          <span th:text="${section.note ?: '—'}" style="color:#374151;font-size:0.875rem;"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Danger Zone -->
  <div style="background:#fff;border-radius:16px;border:1.5px solid #fee2e2;padding:1.25rem 1.5rem;display:flex;align-items:center;justify-content:space-between;">
    <div>
      <div style="font-weight:700;color:#111827;font-size:0.9rem;">Vùng nguy hiểm</div>
      <div style="font-size:0.8rem;color:#9ca3af;margin-top:2px;">Hành động không thể hoàn tác</div>
    </div>
    <button type="button" onclick="document.getElementById('delModal').style.display='flex'"
            style="display:flex;align-items:center;gap:0.5rem;padding:0.65rem 1.25rem;background:#fef2f2;color:#dc2626;border:1.5px solid #fecaca;border-radius:10px;font-weight:700;font-size:0.875rem;cursor:pointer;"
            onmouseover="this.style.background='#fee2e2'" onmouseout="this.style.background='#fef2f2'">
      <i class="bi bi-trash3"></i> Xóa bản ghi
    </button>
  </div>
</div>

<div id="delModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:20px;padding:2rem;max-width:420px;width:90%;box-shadow:0 25px 60px rgba(0,0,0,0.2);animation:slideUp 0.25s ease;">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="width:64px;height:64px;background:#fee2e2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:2rem;color:#dc2626;"><i class="bi bi-exclamation-triangle-fill"></i></div>
      <h3 style="font-size:1.2rem;font-weight:700;color:#111827;margin-bottom:0.5rem;">Xác nhận xóa</h3>
      <p style="color:#6b7280;font-size:0.9rem;">Xóa bản ghi phân lớp này?</p>
    </div>
    <div style="display:flex;gap:0.75rem;">
      <button onclick="document.getElementById('delModal').style.display='none'" style="flex:1;padding:0.75rem;border-radius:10px;border:1.5px solid #e5e7eb;background:#fff;color:#374151;font-weight:600;cursor:pointer;">Hủy bỏ</button>
      <form th:action="@{/student-classe-sections/{id}/delete(id=${section.id})}" method="post" style="flex:1;">
        <button type="submit" style="width:100%;padding:0.75rem;border-radius:10px;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;font-weight:700;border:none;cursor:pointer;"><i class="bi bi-trash3"></i> Xóa</button>
      </form>
    </div>
  </div>
</div>
<style>@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(0.95)}to{opacity:1;transform:none}}</style>

</div>
</body>
</html>
