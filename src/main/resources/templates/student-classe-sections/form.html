<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${isEdit} ? 'Chỉnh sửa Phân lớp' : 'Thêm Phân lớp HP', 'sections', ~{:: .main-layout})}">
<body>
<div class="main-layout">
<div style="width:100%;max-width:800px;">
  <div style="margin-bottom:1.75rem;">
    <a href="/student-classe-sections" style="color:#0891b2;text-decoration:none;font-weight:600;font-size:0.85rem;display:flex;align-items:center;gap:0.35rem;margin-bottom:0.75rem;width:fit-content;">
      <i class="bi bi-arrow-left"></i> Danh sách phân lớp HP
    </a>
    <div style="display:flex;align-items:center;gap:1rem;">
      <div style="width:44px;height:44px;background:linear-gradient(135deg,#0891b2,#06b6d4);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;box-shadow:0 4px 12px rgba(8,145,178,0.3);">
        <i class="bi bi-grid-3x3-gap-fill"></i>
      </div>
      <div>
        <h1 style="font-size:1.4rem;font-weight:800;color:#111827;margin:0;" th:text="${isEdit} ? 'Chỉnh sửa phân lớp HP' : 'Thêm phân lớp HP mới'"></h1>
        <p style="color:#9ca3af;font-size:0.85rem;margin:2px 0 0;">Quản lý sinh viên vào lớp học phần</p>
      </div>
    </div>
  </div>

  <form th:action="${isEdit} ? @{/student-classe-sections/{id}/edit(id=${sectionId})} : @{/student-classe-sections/create}"
        method="post" th:object="${section}">

    <!-- Section 1: Thông tin liên kết -->
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.25rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#ecfeff,#f0fdfe);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:linear-gradient(135deg,#ecfeff,#cffafe);color:#0891b2;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-link-45deg"></i></div>
        <span style="font-weight:700;color:#111827;font-size:0.95rem;">Thông tin liên kết</span>
      </div>
      <div style="padding:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Sinh viên <span style="color:#ef4444;">*</span></label>
          <select th:field="*{studentId}" required
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;background:#fff;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                  onfocus="this.style.borderColor='#0891b2'" onblur="this.style.borderColor='#e5e7eb'">
            <option value="">-- Chọn sinh viên --</option>
            <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.code + ' - ' + s.fullName}"></option>
          </select>
          <span style="color:#ef4444;font-size:0.78rem;display:block;margin-top:4px;" th:if="${#fields.hasErrors('studentId')}" th:errors="*{studentId}"></span>
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Lớp hành chính <span style="color:#ef4444;">*</span></label>
          <select th:field="*{studentClasseId}" required
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;background:#fff;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                  onfocus="this.style.borderColor='#0891b2'" onblur="this.style.borderColor='#e5e7eb'">
            <option value="">-- Chọn lớp --</option>
            <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.code + ' - ' + c.name}"></option>
          </select>
          <span style="color:#ef4444;font-size:0.78rem;display:block;margin-top:4px;" th:if="${#fields.hasErrors('studentClasseId')}" th:errors="*{studentClasseId}"></span>
        </div>
      </div>
    </div>

    <!-- Section 2: Trạng thái & Ghi chú -->
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.75rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#f8fffe,#f0fdf4);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:linear-gradient(135deg,#e9f5ef,#d1fae5);color:#059669;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-info-circle"></i></div>
        <span style="font-weight:700;color:#111827;font-size:0.95rem;">Trạng thái &amp; Ghi chú</span>
      </div>
      <div style="padding:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Trạng thái</label>
          <select th:field="*{status}"
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;background:#fff;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                  onfocus="this.style.borderColor='#059669'" onblur="this.style.borderColor='#e5e7eb'">
            <option value="">-- Chọn --</option>
            <option value="studying">Đang học (studying)</option>
            <option value="completed">Đã xong (completed)</option>
            <option value="dropped">Bỏ học (dropped)</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Ghi chú</label>
          <input type="text" th:field="*{note}" placeholder="Ghi chú thêm..."
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#059669'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Ngày bắt đầu</label>
          <input type="datetime-local" th:field="*{startDate}"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#059669'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Ngày kết thúc</label>
          <input type="datetime-local" th:field="*{endDate}"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#059669'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:0.75rem;">
      <a href="/student-classe-sections" style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 1.5rem;background:#fff;color:#374151;border:1.5px solid #e5e7eb;border-radius:10px;text-decoration:none;font-weight:600;font-size:0.9rem;transition:all 0.2s;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='#fff'">
        <i class="bi bi-x-lg"></i> Hủy bỏ
      </a>
      <button type="submit" style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 2rem;background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:0.9rem;cursor:pointer;box-shadow:0 4px 12px rgba(8,145,178,0.3);transition:all 0.2s;" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">
        <i class="bi bi-check2-circle"></i>
        <span th:text="${isEdit} ? 'Cập nhật' : 'Thêm mới'"></span>
      </button>
    </div>
  </form>
</div>
</div>
</body>
</html>
