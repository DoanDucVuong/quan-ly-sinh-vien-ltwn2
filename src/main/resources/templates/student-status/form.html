<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${isEdit} ? 'Chỉnh sửa Trạng thái' : 'Cập nhật Trạng thái', 'status', ~{:: .main-layout})}">
<body>
<div class="main-layout">
<div style="width:100%;max-width:800px;">
  <div style="margin-bottom:1.75rem;">
    <a href="/student-status" style="color:#dc2626;text-decoration:none;font-weight:600;font-size:0.85rem;display:flex;align-items:center;gap:0.35rem;margin-bottom:0.75rem;width:fit-content;">
      <i class="bi bi-arrow-left"></i> Danh sách trạng thái
    </a>
    <div style="display:flex;align-items:center;gap:1rem;">
      <div style="width:44px;height:44px;background:linear-gradient(135deg,#dc2626,#ef4444);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;box-shadow:0 4px 12px rgba(220,38,38,0.3);">
        <i class="bi bi-clipboard2-pulse"></i>
      </div>
      <div>
        <h1 style="font-size:1.4rem;font-weight:800;color:#111827;margin:0;" th:text="${isEdit} ? 'Chỉnh sửa trạng thái' : 'Cập nhật trạng thái mới'"></h1>
        <p style="color:#9ca3af;font-size:0.85rem;margin:2px 0 0;">Ghi nhận thay đổi trạng thái học tập của sinh viên</p>
      </div>
    </div>
  </div>

  <form th:action="${isEdit} ? @{/student-status/{id}/edit(id=${statusId})} : @{/student-status/create}"
        method="post" th:object="${statusReq}">

    <!-- Section 1: Sinh viên & Trạng thái -->
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.25rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#fff5f5,#fef2f2);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:linear-gradient(135deg,#fef2f2,#fee2e2);color:#dc2626;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-person-lines-fill"></i></div>
        <span style="font-weight:700;color:#111827;font-size:0.95rem;">Thông tin sinh viên &amp; Trạng thái</span>
      </div>
      <div style="padding:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
        <div style="grid-column:span 2;">
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Sinh viên <span style="color:#ef4444;">*</span></label>
          <select th:field="*{studentId}" required
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;background:#fff;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                  onfocus="this.style.borderColor='#dc2626'" onblur="this.style.borderColor='#e5e7eb'">
            <option value="">-- Chọn sinh viên --</option>
            <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.code + ' - ' + s.fullName}"></option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Mã trạng thái <span style="color:#ef4444;">*</span></label>
          <input type="text" th:field="*{statusCode}" placeholder="VD: dang_hoc, bao_luu..."
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:monospace;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#dc2626';this.style.boxShadow='0 0 0 3px rgba(220,38,38,0.1)'" onblur="this.style.borderColor='#e5e7eb';this.style.boxShadow='none'">
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Tên trạng thái <span style="color:#ef4444;">*</span></label>
          <select th:field="*{statusName}"
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;background:#fff;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                  onfocus="this.style.borderColor='#dc2626'" onblur="this.style.borderColor='#e5e7eb'">
            <option value="">-- Chọn trạng thái --</option>
            <option value="Đang học">Đang học</option>
            <option value="Thôi học">Thôi học</option>
            <option value="Tốt nghiệp">Tốt nghiệp</option>
            <option value="Bảo lưu">Bảo lưu</option>
            <option value="Ngừng học">Ngừng học</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Section 2: Thời gian -->
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.25rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#f0fdf4,#f8fffe);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:linear-gradient(135deg,#e9f5ef,#d1fae5);color:#059669;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-calendar-event"></i></div>
        <span style="font-weight:700;color:#111827;font-size:0.95rem;">Thời gian áp dụng</span>
      </div>
      <div style="padding:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Ngày bắt đầu</label>
          <input type="date" th:field="*{startDate}"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#059669'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Ngày kết thúc</label>
          <input type="date" th:field="*{endDate}"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#059669'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
      </div>
    </div>

    <!-- Section 3: Lý do -->
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.75rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#fafafa,#f3f4f6);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:#f3f4f6;color:#6b7280;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-journal-text"></i></div>
        <span style="font-weight:700;color:#111827;font-size:0.95rem;">Chi tiết &amp; Lý do</span>
      </div>
      <div style="padding:1.5rem;">
        <textarea th:field="*{reason}" rows="4" placeholder="Nhập lý do thay đổi hoặc mô tả chi tiết tình trạng của sinh viên..."
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:all 0.2s;box-sizing:border-box;resize:vertical;"
                  onfocus="this.style.borderColor='#6b7280'" onblur="this.style.borderColor='#e5e7eb'"></textarea>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:0.75rem;">
      <a href="/student-status" style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 1.5rem;background:#fff;color:#374151;border:1.5px solid #e5e7eb;border-radius:10px;text-decoration:none;font-weight:600;font-size:0.9rem;transition:all 0.2s;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='#fff'">
        <i class="bi bi-x-lg"></i> Hủy bỏ
      </a>
      <button type="submit" style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 2rem;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:0.9rem;cursor:pointer;box-shadow:0 4px 12px rgba(220,38,38,0.3);transition:all 0.2s;" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">
        <i class="bi bi-check2-circle"></i>
        <span th:text="${isEdit} ? 'Cập nhật trạng thái' : 'Lưu trạng thái'"></span>
      </button>
    </div>
  </form>
</div>
</div>
</body>
</html>
