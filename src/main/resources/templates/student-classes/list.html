<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Lớp hành chính', 'classes', ~{:: .main-layout})}">
<body>
<div class="main-layout">
<div style="width:100%;padding:0;">

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;">
    <form method="get" action="/student-classes" style="display:flex;gap:0.5rem;align-items:center;">
      <div style="position:relative;">
        <i class="bi bi-search" style="position:absolute;left:0.9rem;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:0.85rem;pointer-events:none;"></i>
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm tên hoặc mã lớp..."
               style="padding:0.6rem 1rem 0.6rem 2.4rem;width:280px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:border-color 0.2s;"
               onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#e5e7eb'">
      </div>
      <button type="submit" style="padding:0.6rem 1.1rem;background:#f3f4f6;color:#374151;border:1.5px solid #e5e7eb;border-radius:10px;font-weight:600;font-size:0.85rem;cursor:pointer;display:flex;align-items:center;gap:0.4rem;" onmouseover="this.style.background='#e5e7eb'" onmouseout="this.style.background='#f3f4f6'">
        <i class="bi bi-search"></i> Tìm kiếm
      </button>
    </form>
    <a href="/student-classes/create"
       style="display:flex;align-items:center;gap:0.5rem;padding:0.65rem 1.4rem;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;border-radius:10px;text-decoration:none;font-weight:700;font-size:0.9rem;box-shadow:0 4px 12px rgba(37,99,235,0.3);transition:all 0.2s;"
       onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">
      <i class="bi bi-plus-circle-fill"></i> Thêm lớp mới
    </a>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem;">
    <div style="background:#fff;padding:1.25rem;border-radius:14px;border:1px solid #f0f0f0;display:flex;align-items:center;gap:1rem;box-shadow:0 1px 4px rgba(0,0,0,0.03);">
      <div style="width:48px;height:48px;background:linear-gradient(135deg,#eff6ff,#dbeafe);color:#2563eb;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;"><i class="bi bi-building-fill"></i></div>
      <div>
        <div style="font-size:1.75rem;font-weight:800;color:#111827;line-height:1;" th:text="${totalElements}">0</div>
        <div style="font-size:0.8rem;color:#9ca3af;font-weight:500;margin-top:3px;">Tổng số lớp</div>
      </div>
    </div>
    <div style="background:#fff;padding:1.25rem;border-radius:14px;border:1px solid #f0f0f0;display:flex;align-items:center;gap:1rem;box-shadow:0 1px 4px rgba(0,0,0,0.03);">
      <div style="width:48px;height:48px;background:linear-gradient(135deg,#f0fdf4,#d1fae5);color:#059669;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;"><i class="bi bi-check2-all"></i></div>
      <div>
        <div style="font-size:1.75rem;font-weight:800;color:#111827;line-height:1;" th:text="${totalElements}">0</div>
        <div style="font-size:0.8rem;color:#9ca3af;font-weight:500;margin-top:3px;">Đang hoạt động</div>
      </div>
    </div>
    <div style="background:linear-gradient(135deg,#2563eb,#3b82f6);padding:1.25rem;border-radius:14px;display:flex;align-items:center;gap:1rem;box-shadow:0 4px 16px rgba(37,99,235,0.25);">
      <div style="width:48px;height:48px;background:rgba(255,255,255,0.2);color:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;"><i class="bi bi-door-open-fill"></i></div>
      <div>
        <div style="font-size:1rem;font-weight:700;color:#fff;">Lớp</div>
        <div style="font-size:0.8rem;color:rgba(255,255,255,0.8);margin-top:3px;">Hành chính</div>
      </div>
    </div>
  </div>

  <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="background:linear-gradient(90deg,#f0f9ff,#eff6ff);border-bottom:2px solid #e5e7eb;">
            <th style="padding:1rem 1.25rem;text-align:left;font-size:0.72rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;width:50px;white-space:nowrap;">#</th>
            <th style="padding:1rem 1.25rem;text-align:left;font-size:0.72rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;">Mã lớp</th>
            <th style="padding:1rem 1.25rem;text-align:left;font-size:0.72rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;min-width:180px;">Tên lớp</th>
            <th style="padding:1rem 1.25rem;text-align:left;font-size:0.72rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;min-width:160px;">Khoa/Bộ môn</th>
            <th style="padding:1rem 1.25rem;text-align:left;font-size:0.72rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;min-width:140px;">Ngành</th>
            <th style="padding:1rem 1.25rem;text-align:left;font-size:0.72rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;">Trạng thái</th>
            <th style="padding:1rem 1.25rem;text-align:center;font-size:0.72rem;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:0.06em;width:120px;white-space:nowrap;">Hành động</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${classes.isEmpty()}">
            <td colspan="7" style="text-align:center;padding:5rem 2rem;">
              <i class="bi bi-building" style="font-size:3.5rem;color:#d1d5db;display:block;margin-bottom:1rem;"></i>
              <div style="color:#6b7280;font-weight:600;">Chưa có lớp hành chính nào</div>
            </td>
          </tr>
          <tr th:each="sc, stat : ${classes}"
              style="border-bottom:1px solid #f9fafb;transition:background 0.15s;"
              onmouseover="this.style.background='#f0f9ff'" onmouseout="this.style.background='transparent'">
            <td style="padding:1rem 1.25rem;color:#d1d5db;font-size:0.85rem;" th:text="${currentPage * pageSize + stat.count}"></td>
            <td style="padding:1rem 1.25rem;white-space:nowrap;">
              <span th:text="${sc.code}" style="background:#eff6ff;color:#1d4ed8;padding:4px 12px;border-radius:8px;font-weight:700;font-size:0.8rem;font-family:'Courier New',monospace;border:1px solid #bfdbfe;white-space:nowrap;display:inline-block;"></span>
            </td>
            <td style="padding:1rem 1.25rem;">
              <div style="display:flex;align-items:center;gap:0.75rem;">
                <div style="width:38px;height:38px;background:linear-gradient(135deg,#eff6ff,#dbeafe);color:#2563eb;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;"><i class="bi bi-door-open"></i></div>
                <div th:text="${sc.name}" style="font-weight:700;color:#111827;font-size:0.95rem;"></div>
              </div>
            </td>
            <td style="padding:1rem 1.25rem;font-size:0.85rem;color:#374151;" th:text="${sc.departmentName ?: '—'}"></td>
            <td style="padding:1rem 1.25rem;font-size:0.85rem;color:#374151;" th:text="${sc.majorName ?: '—'}"></td>
            <td style="padding:1rem 1.25rem;white-space:nowrap;">
              <span th:if="${sc.isActive}" style="padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700;background:#f0fdf4;color:#15803d;border:1.5px solid #bbf7d0;white-space:nowrap;display:inline-block;">Hoạt động</span>
              <span th:unless="${sc.isActive}" style="padding:4px 12px;border-radius:20px;font-size:0.75rem;font-weight:700;background:#fef2f2;color:#dc2626;border:1.5px solid #fecaca;white-space:nowrap;display:inline-block;">Ngừng</span>
            </td>
            <td style="padding:1rem 1.25rem;text-align:center;">
              <div style="display:flex;gap:0.4rem;justify-content:center;">
                <a th:href="@{/student-classes/{id}(id=${sc.id})}"
                   style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#f3f4f6;color:#6b7280;text-decoration:none;font-size:0.9rem;border:1px solid #e5e7eb;transition:all 0.15s;"
                   title="Xem" onmouseover="this.style.background='#e0f2fe';this.style.color='#0369a1'" onmouseout="this.style.background='#f3f4f6';this.style.color='#6b7280'">
                  <i class="bi bi-eye"></i>
                </a>
                <a th:href="@{/student-classes/{id}/edit(id=${sc.id})}"
                   style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#f3f4f6;color:#6b7280;text-decoration:none;font-size:0.9rem;border:1px solid #e5e7eb;transition:all 0.15s;"
                   title="Sửa" onmouseover="this.style.background='#fef9c3';this.style.color='#854d0e'" onmouseout="this.style.background='#f3f4f6';this.style.color='#6b7280'">
                  <i class="bi bi-pencil-square"></i>
                </a>
                <button type="button" th:attr="onclick='openModal(this)',data-id=${sc.id},data-name=${sc.name}"
                        style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#f3f4f6;color:#6b7280;border:1px solid #e5e7eb;cursor:pointer;font-size:0.9rem;transition:all 0.15s;"
                        title="Xóa" onmouseover="this.style.background='#fee2e2';this.style.color='#dc2626'" onmouseout="this.style.background='#f3f4f6';this.style.color='#6b7280'">
                  <i class="bi bi-trash3"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div th:if="${totalPages > 1}" style="padding:1rem 1.5rem;border-top:1px solid #f3f4f6;display:flex;justify-content:space-between;align-items:center;background:#fafafa;">
      <span style="font-size:0.85rem;color:#6b7280;">Tổng <strong style="color:#111827;" th:text="${totalElements}"></strong> lớp</span>
      <div style="display:flex;gap:0.3rem;">
        <a th:href="@{/student-classes(page=${currentPage-1},keyword=${keyword})}" th:if="${currentPage>0}" style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid #e5e7eb;background:#fff;color:#6b7280;text-decoration:none;font-size:0.8rem;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='#fff'"><i class="bi bi-chevron-left"></i></a>
        <a th:href="@{/student-classes(page=${currentPage+1},keyword=${keyword})}" th:if="${currentPage+1<totalPages}" style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid #e5e7eb;background:#fff;color:#6b7280;text-decoration:none;font-size:0.8rem;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='#fff'"><i class="bi bi-chevron-right"></i></a>
      </div>
    </div>
  </div>
</div>

<div id="delModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:20px;padding:2rem;max-width:420px;width:90%;box-shadow:0 25px 60px rgba(0,0,0,0.2);animation:slideUp 0.25s ease;">
    <div style="text-align:center;margin-bottom:1.5rem;">
      <div style="width:64px;height:64px;background:#fee2e2;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:2rem;color:#dc2626;"><i class="bi bi-exclamation-triangle-fill"></i></div>
      <h3 style="font-size:1.2rem;font-weight:700;color:#111827;margin-bottom:0.5rem;">Xác nhận xóa</h3>
      <p style="color:#6b7280;font-size:0.9rem;">Xóa lớp hành chính</p>
      <p><strong id="delName" style="color:#dc2626;"></strong></p>
    </div>
    <div style="display:flex;gap:0.75rem;">
      <button onclick="closeModal()" style="flex:1;padding:0.75rem;border-radius:10px;border:1.5px solid #e5e7eb;background:#fff;color:#374151;font-weight:600;cursor:pointer;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='#fff'">Hủy bỏ</button>
      <form id="delForm" method="post" style="flex:1;">
        <button type="submit" style="width:100%;padding:0.75rem;border-radius:10px;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;font-weight:700;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(220,38,38,0.3);"><i class="bi bi-trash3"></i> Xóa</button>
      </form>
    </div>
  </div>
</div>
<style>@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(0.95)}to{opacity:1;transform:none}}</style>
<script>
function openModal(b){document.getElementById('delName').textContent=b.dataset.name;document.getElementById('delForm').action='/student-classes/'+b.dataset.id+'/delete';document.getElementById('delModal').style.display='flex';}
function closeModal(){document.getElementById('delModal').style.display='none';}
document.getElementById('delModal').addEventListener('click',function(e){if(e.target===this)closeModal();});
</script>

</div>
</body>
</html>
