<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${isEdit} ? 'Chỉnh sửa Lớp HC' : 'Thêm Lớp mới', 'classes', ~{:: .main-layout})}">
<body>
<div class="main-layout">
<div style="width:100%;max-width:800px;">
  <div style="margin-bottom:1.75rem;">
    <a href="/student-classes" style="color:#2563eb;text-decoration:none;font-weight:600;font-size:0.85rem;display:flex;align-items:center;gap:0.35rem;margin-bottom:0.75rem;width:fit-content;">
      <i class="bi bi-arrow-left"></i> Danh sách lớp hành chính
    </a>
    <div style="display:flex;align-items:center;gap:1rem;">
      <div style="width:44px;height:44px;background:linear-gradient(135deg,#2563eb,#3b82f6);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;box-shadow:0 4px 12px rgba(37,99,235,0.3);">
        <i th:class="${isEdit} ? 'bi bi-pencil-square' : 'bi bi-building-add'"></i>
      </div>
      <div>
        <h1 style="font-size:1.4rem;font-weight:800;color:#111827;margin:0;" th:text="${isEdit} ? 'Chỉnh sửa lớp hành chính' : 'Thêm lớp hành chính mới'"></h1>
        <p style="color:#9ca3af;font-size:0.85rem;margin:2px 0 0;">Điền đầy đủ thông tin vào form bên dưới</p>
      </div>
    </div>
  </div>

  <form th:action="${isEdit} ? @{/student-classes/{id}/edit(id=${classId})} : @{/student-classes/create}"
        method="post" th:object="${studentClass}">

    <!-- Section 1: Thông tin cơ bản -->
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.25rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#f0f9ff,#eff6ff);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:linear-gradient(135deg,#eff6ff,#dbeafe);color:#2563eb;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-door-open"></i></div>
        <span style="font-weight:700;color:#111827;font-size:0.95rem;">Thông tin lớp học</span>
      </div>
      <div style="padding:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Mã lớp <span style="color:#ef4444;">*</span></label>
          <input type="text" th:field="*{code}" placeholder="VD: CNTT-K2024-A1" required
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#2563eb';this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.1)'" onblur="this.style.borderColor='#e5e7eb';this.style.boxShadow='none'">
          <span style="color:#ef4444;font-size:0.78rem;display:block;margin-top:4px;" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></span>
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Tên lớp <span style="color:#ef4444;">*</span></label>
          <input type="text" th:field="*{name}" placeholder="VD: Công nghệ thông tin K2024 A1" required
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#2563eb';this.style.boxShadow='0 0 0 3px rgba(37,99,235,0.1)'" onblur="this.style.borderColor='#e5e7eb';this.style.boxShadow='none'">
          <span style="color:#ef4444;font-size:0.78rem;display:block;margin-top:4px;" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
      </div>
    </div>

    <!-- Section 2: Liên kết quản lý -->
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.75rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#f8fffe,#f0fdf4);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:linear-gradient(135deg,#e9f5ef,#d1fae5);color:#059669;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-diagram-3"></i></div>
        <div>
          <span style="font-weight:700;color:#111827;font-size:0.95rem;">Liên kết quản lý</span>
          <span style="font-size:0.78rem;color:#9ca3af;margin-left:0.5rem;">(UUID — tùy chọn)</span>
        </div>
      </div>
      <div style="padding:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">ID Năm học</label>
          <input type="text" th:field="*{academicYearId}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.85rem;outline:none;font-family:monospace;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#059669'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">ID Khoa/Bộ môn</label>
          <input type="text" th:field="*{departmentId}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.85rem;outline:none;font-family:monospace;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#059669'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">ID Ngành học</label>
          <input type="text" th:field="*{majorId}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.85rem;outline:none;font-family:monospace;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#059669'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">ID Chương trình ĐT</label>
          <input type="text" th:field="*{trainingProgramId}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.85rem;outline:none;font-family:monospace;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#059669'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
        <div style="grid-column:span 2;">
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">ID Giáo viên chủ nhiệm</label>
          <input type="text" th:field="*{employeeId}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.85rem;outline:none;font-family:monospace;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#059669'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:0.75rem;">
      <a href="/student-classes" style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 1.5rem;background:#fff;color:#374151;border:1.5px solid #e5e7eb;border-radius:10px;text-decoration:none;font-weight:600;font-size:0.9rem;transition:all 0.2s;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='#fff'">
        <i class="bi bi-x-lg"></i> Hủy bỏ
      </a>
      <button type="submit" style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 2rem;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:0.9rem;cursor:pointer;box-shadow:0 4px 12px rgba(37,99,235,0.3);transition:all 0.2s;" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">
        <i class="bi bi-check2-circle"></i>
        <span th:text="${isEdit} ? 'Cập nhật lớp' : 'Thêm lớp mới'"></span>
      </button>
    </div>
  </form>
</div>
</div>
</body>
</html>
