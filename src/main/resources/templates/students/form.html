<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${isEdit} ? 'Chỉnh sửa Học sinh' : 'Thêm Học sinh mới', 'students', ~{:: .main-layout})}">
<body>
<div class="main-layout">
<div style="width:100%;max-width:900px;">

  <!-- Breadcrumb + Title -->
  <div style="margin-bottom:1.75rem;">
    <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem;font-size:0.85rem;color:#9ca3af;">
      <a href="/students" style="color:#1f9c64;text-decoration:none;font-weight:600;display:flex;align-items:center;gap:0.35rem;">
        <i class="bi bi-arrow-left"></i> Danh sách học sinh
      </a>
    </div>
    <div style="display:flex;align-items:center;gap:1rem;">
      <div style="width:44px;height:44px;background:linear-gradient(135deg,#1f9c64,#10b981);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;box-shadow:0 4px 12px rgba(31,156,100,0.3);">
        <i th:class="${isEdit} ? 'bi bi-pencil-square' : 'bi bi-person-plus'"></i>
      </div>
      <div>
        <h1 style="font-size:1.4rem;font-weight:800;color:#111827;margin:0;" th:text="${isEdit} ? 'Chỉnh sửa thông tin học sinh' : 'Thêm học sinh mới'"></h1>
        <p style="color:#9ca3af;font-size:0.85rem;margin:2px 0 0;">Điền đầy đủ thông tin cần thiết vào form bên dưới</p>
      </div>
    </div>
  </div>

  <form th:action="${isEdit} ? @{/students/{id}/edit(id=${studentId})} : @{/students/create}"
        method="post" th:object="${student}">

    <!-- Section 1: Thông tin cơ bản -->
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.25rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#f8fffe,#f0fdf4);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:linear-gradient(135deg,#e9f5ef,#d1fae5);color:#059669;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-person-badge"></i></div>
        <span style="font-weight:700;color:#111827;font-size:0.95rem;">Thông tin cơ bản</span>
      </div>
      <div style="padding:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Mã sinh viên <span style="color:#ef4444;">*</span></label>
          <input type="text" th:field="*{code}" placeholder="VD: SV10001"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:border-color 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#1f9c64';this.style.boxShadow='0 0 0 3px rgba(31,156,100,0.1)'" onblur="this.style.borderColor='#e5e7eb';this.style.boxShadow='none'">
          <span style="color:#ef4444;font-size:0.78rem;margin-top:4px;display:block;" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></span>
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Họ và tên <span style="color:#ef4444;">*</span></label>
          <input type="text" th:field="*{fullName}" placeholder="Nguyễn Văn A"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:border-color 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#1f9c64';this.style.boxShadow='0 0 0 3px rgba(31,156,100,0.1)'" onblur="this.style.borderColor='#e5e7eb';this.style.boxShadow='none'">
          <span style="color:#ef4444;font-size:0.78rem;margin-top:4px;display:block;" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Ngày sinh</label>
          <input type="date" th:field="*{dateOfBirth}"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:border-color 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#1f9c64'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Giới tính</label>
          <select th:field="*{gender}"
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;background:#fff;font-family:inherit;transition:border-color 0.2s;box-sizing:border-box;"
                  onfocus="this.style.borderColor='#1f9c64'" onblur="this.style.borderColor='#e5e7eb'">
            <option value="">-- Chọn giới tính --</option>
            <option value="Nam">Nam</option>
            <option value="Nữ">Nữ</option>
            <option value="Khác">Khác</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Section 2: Giấy tờ & Địa chỉ -->
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.25rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#fff7ed,#fff5eb);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:linear-gradient(135deg,#fff7ed,#fed7aa);color:#ea580c;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-credit-card"></i></div>
        <span style="font-weight:700;color:#111827;font-size:0.95rem;">Giấy tờ &amp; Địa chỉ</span>
      </div>
      <div style="padding:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Số CCCD/CMND</label>
          <input type="text" th:field="*{personalIdentificationNumber}" placeholder="012345678901"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:border-color 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#ea580c'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Nơi cấp</label>
          <input type="text" th:field="*{cardPlace}" placeholder="Công an TP. Hà Nội"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:border-color 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#ea580c'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
        <div style="grid-column:span 2;">
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Địa chỉ thường trú</label>
          <input type="text" th:field="*{address}" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/TP..."
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:border-color 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#ea580c'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
      </div>
    </div>

    <!-- Section 3: Học vụ -->
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.75rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#f0f9ff,#eff6ff);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:linear-gradient(135deg,#eff6ff,#dbeafe);color:#2563eb;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-mortarboard"></i></div>
        <span style="font-weight:700;color:#111827;font-size:0.95rem;">Thông tin học vụ</span>
      </div>
      <div style="padding:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Lớp hành chính <span style="color:#ef4444;">*</span></label>
          <select th:field="*{studentClasseId}" required
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;background:#fff;font-family:inherit;transition:border-color 0.2s;box-sizing:border-box;"
                  onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#e5e7eb'">
            <option value="">-- Chọn lớp hành chính --</option>
            <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.code + ' - ' + c.name}"></option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Trạng thái</label>
          <select th:field="*{status}"
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;background:#fff;font-family:inherit;transition:border-color 0.2s;box-sizing:border-box;"
                  onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#e5e7eb'">
            <option value="Đang học">Đang học</option>
            <option value="Thôi học">Thôi học</option>
            <option value="Bảo lưu">Bảo lưu</option>
            <option value="Tốt nghiệp">Tốt nghiệp</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Khoa</label>
          <select th:field="*{departmentId}"
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;background:#fff;font-family:inherit;transition:border-color 0.2s;box-sizing:border-box;"
                  onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#e5e7eb'">
            <option value="">-- Chọn khoa --</option>
            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Ngành học</label>
          <select th:field="*{majorId}"
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;background:#fff;font-family:inherit;transition:border-color 0.2s;box-sizing:border-box;"
                  onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#e5e7eb'">
            <option value="">-- Chọn ngành --</option>
            <option th:each="m : ${majors}" th:value="${m.id}" th:text="${m.name}"></option>
          </select>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div style="display:flex;justify-content:flex-end;gap:0.75rem;padding-bottom:2rem;">
      <a href="/students"
         style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 1.5rem;background:#fff;color:#374151;border:1.5px solid #e5e7eb;border-radius:10px;text-decoration:none;font-weight:600;font-size:0.9rem;transition:all 0.2s;"
         onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='#fff'">
        <i class="bi bi-x-lg"></i> Hủy bỏ
      </a>
      <button type="submit"
              style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 2rem;background:linear-gradient(135deg,#1f9c64,#16a34a);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:0.9rem;cursor:pointer;box-shadow:0 4px 12px rgba(31,156,100,0.3);transition:all 0.2s;"
              onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 6px 16px rgba(31,156,100,0.4)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 4px 12px rgba(31,156,100,0.3)'">
        <i class="bi bi-check2-circle"></i>
        <span th:text="${isEdit} ? 'Cập nhật học sinh' : 'Lưu học sinh'"></span>
      </button>
    </div>
  </form>
</div>
</div>
</body>
</html>
