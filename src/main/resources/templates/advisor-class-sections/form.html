<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${isEdit} ? 'Chỉnh sửa Cố vấn' : 'Thêm Phân công', 'advisors', ~{:: .main-layout})}">
<body>
<div class="main-layout">
<div style="width:100%;max-width:800px;">
  <div style="margin-bottom:1.75rem;">
    <a href="/advisor-class-sections" style="color:#ea580c;text-decoration:none;font-weight:600;font-size:0.85rem;display:flex;align-items:center;gap:0.35rem;margin-bottom:0.75rem;width:fit-content;">
      <i class="bi bi-arrow-left"></i> Danh sách phân công
    </a>
    <div style="display:flex;align-items:center;gap:1rem;">
      <div style="width:44px;height:44px;background:linear-gradient(135deg,#ea580c,#f97316);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;box-shadow:0 4px 12px rgba(234,88,12,0.3);">
        <i class="bi bi-person-workspace"></i>
      </div>
      <div>
        <h1 style="font-size:1.4rem;font-weight:800;color:#111827;margin:0;" th:text="${isEdit} ? 'Chỉnh sửa phân công cố vấn' : 'Thêm phân công cố vấn mới'"></h1>
        <p style="color:#9ca3af;font-size:0.85rem;margin:2px 0 0;">Phân công giảng viên làm cố vấn học tập cho lớp</p>
      </div>
    </div>
  </div>

  <form th:action="${isEdit} ? @{/advisor-class-sections/{id}/edit(id=${advisorId})} : @{/advisor-class-sections/create}"
        method="post" th:object="${advisorReq}">

    <!-- Section 1: Phân công -->
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.25rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#fff7ed,#fff5eb);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:linear-gradient(135deg,#fff7ed,#fed7aa);color:#ea580c;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-person-workspace"></i></div>
        <span style="font-weight:700;color:#111827;font-size:0.95rem;">Thông tin liên kết</span>
      </div>
      <div style="padding:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Lớp hành chính <span style="color:#ef4444;">*</span></label>
          <select th:field="*{studentClasseId}" required
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;background:#fff;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                  onfocus="this.style.borderColor='#ea580c'" onblur="this.style.borderColor='#e5e7eb'">
            <option value="">-- Chọn lớp --</option>
            <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.code + ' - ' + c.name}"></option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">ID Giảng viên <span style="color:#ef4444;">*</span></label>
          <input type="text" th:field="*{employeeId}" placeholder="Nhập ID giảng viên phụ trách" required
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:monospace;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#ea580c';this.style.boxShadow='0 0 0 3px rgba(234,88,12,0.1)'" onblur="this.style.borderColor='#e5e7eb';this.style.boxShadow='none'">
        </div>
      </div>
    </div>

    <!-- Section 2: Thời gian -->
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.25rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#f0fdf4,#f8fffe);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:linear-gradient(135deg,#e9f5ef,#d1fae5);color:#059669;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-calendar-range"></i></div>
        <span style="font-weight:700;color:#111827;font-size:0.95rem;">Thời gian phụ trách</span>
      </div>
      <div style="padding:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;">
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Ngày bắt đầu</label>
          <input type="datetime-local" th:field="*{startDate}"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#059669'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Ngày kết thúc (nếu có)</label>
          <input type="datetime-local" th:field="*{endDate}"
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#059669'" onblur="this.style.borderColor='#e5e7eb'">
        </div>
      </div>
    </div>

    <!-- Section 3: Ghi chú -->
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.75rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#fafafa,#f3f4f6);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:#f3f4f6;color:#6b7280;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-card-text"></i></div>
        <span style="font-weight:700;color:#111827;font-size:0.95rem;">Ghi chú &amp; Nhiệm vụ</span>
      </div>
      <div style="padding:1.5rem;">
        <textarea th:field="*{description}" rows="3" placeholder="Mô tả chi tiết nhiệm vụ của cố vấn học tập..."
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:all 0.2s;box-sizing:border-box;resize:vertical;"
                  onfocus="this.style.borderColor='#6b7280'" onblur="this.style.borderColor='#e5e7eb'"></textarea>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:0.75rem;">
      <a href="/advisor-class-sections" style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 1.5rem;background:#fff;color:#374151;border:1.5px solid #e5e7eb;border-radius:10px;text-decoration:none;font-weight:600;font-size:0.9rem;transition:all 0.2s;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='#fff'">
        <i class="bi bi-x-lg"></i> Hủy bỏ
      </a>
      <button type="submit" style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 2rem;background:linear-gradient(135deg,#ea580c,#f97316);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:0.9rem;cursor:pointer;box-shadow:0 4px 12px rgba(234,88,12,0.3);transition:all 0.2s;" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">
        <i class="bi bi-check2-circle"></i>
        <span th:text="${isEdit} ? 'Cập nhật phân công' : 'Lưu phân công'"></span>
      </button>
    </div>
  </form>
</div>
</div>
</body>
</html>
