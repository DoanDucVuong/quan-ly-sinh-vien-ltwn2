<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${isEdit} ? 'Chỉnh sửa Ngành' : 'Thêm ngành mới', 'majors', ~{:: .main-layout})}">
<body>
<div class="main-layout">
<div style="width:100%;max-width:680px;">
  <div style="margin-bottom:1.75rem;">
    <a href="/majors" style="color:#7c3aed;text-decoration:none;font-weight:600;font-size:0.85rem;display:flex;align-items:center;gap:0.35rem;margin-bottom:0.75rem;width:fit-content;">
      <i class="bi bi-arrow-left"></i> Danh sách ngành học
    </a>
    <div style="display:flex;align-items:center;gap:1rem;">
      <div style="width:44px;height:44px;background:linear-gradient(135deg,#7c3aed,#8b5cf6);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;box-shadow:0 4px 12px rgba(124,58,237,0.3);">
        <i class="bi bi-journal-bookmark"></i>
      </div>
      <div>
        <h1 style="font-size:1.4rem;font-weight:800;color:#111827;margin:0;" th:text="${isEdit} ? 'Chỉnh sửa ngành học' : 'Thêm ngành học mới'"></h1>
        <p style="color:#9ca3af;font-size:0.85rem;margin:2px 0 0;">Điền đầy đủ thông tin vào form bên dưới</p>
      </div>
    </div>
  </div>

  <form th:action="${isEdit} ? @{/majors/{id}/edit(id=${majorId})} : @{/majors/create}"
        method="post" th:object="${majorReq}">
    <div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;overflow:hidden;margin-bottom:1.25rem;box-shadow:0 1px 8px rgba(0,0,0,0.04);">
      <div style="padding:1rem 1.5rem;background:linear-gradient(90deg,#faf5ff,#f5f3ff);border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:0.75rem;">
        <div style="width:34px;height:34px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);color:#7c3aed;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;"><i class="bi bi-journal-bookmark"></i></div>
        <span style="font-weight:700;color:#111827;font-size:0.95rem;">Thông tin ngành học</span>
      </div>
      <div style="padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem;">
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Mã ngành <span style="color:#ef4444;">*</span></label>
          <input type="text" th:field="*{code}" placeholder="VD: CNPM" required
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#7c3aed';this.style.boxShadow='0 0 0 3px rgba(124,58,237,0.1)'" onblur="this.style.borderColor='#e5e7eb';this.style.boxShadow='none'">
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Tên ngành học <span style="color:#ef4444;">*</span></label>
          <input type="text" th:field="*{name}" placeholder="Công nghệ phần mềm" required
                 style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                 onfocus="this.style.borderColor='#7c3aed';this.style.boxShadow='0 0 0 3px rgba(124,58,237,0.1)'" onblur="this.style.borderColor='#e5e7eb';this.style.boxShadow='none'">
        </div>
        <div>
          <label style="display:block;font-size:0.82rem;font-weight:700;color:#6b7280;margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.04em;">Thuộc khoa <span style="color:#ef4444;">*</span></label>
          <select th:field="*{departmentId}" required
                  style="width:100%;padding:0.7rem 1rem;border:1.5px solid #e5e7eb;border-radius:10px;font-size:0.9rem;outline:none;background:#fff;font-family:inherit;transition:all 0.2s;box-sizing:border-box;"
                  onfocus="this.style.borderColor='#7c3aed'" onblur="this.style.borderColor='#e5e7eb'">
            <option value="">-- Chọn khoa --</option>
            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
          </select>
        </div>
      </div>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:0.75rem;">
      <a href="/majors" style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 1.5rem;background:#fff;color:#374151;border:1.5px solid #e5e7eb;border-radius:10px;text-decoration:none;font-weight:600;font-size:0.9rem;transition:all 0.2s;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='#fff'">
        <i class="bi bi-x-lg"></i> Hủy bỏ
      </a>
      <button type="submit" style="display:flex;align-items:center;gap:0.5rem;padding:0.75rem 2rem;background:linear-gradient(135deg,#7c3aed,#8b5cf6);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:0.9rem;cursor:pointer;box-shadow:0 4px 12px rgba(124,58,237,0.3);transition:all 0.2s;" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">
        <i class="bi bi-check2-circle"></i>
        <span th:text="${isEdit} ? 'Cập nhật' : 'Lưu ngành'"></span>
      </button>
    </div>
  </form>
</div>
</div>
</body>
</html>
