spring.application.name=kthp_ltwn2

# =============================================
# SQL Server - SQL Authentication (Local Dev)
# On Render, these are overridden by Environment Variables
# =============================================
spring.datasource.url=jdbc:sqlserver://localhost\\\\SQLEXPRESS;databaseName=student_management;encrypt=true;trustServerCertificate=true
spring.datasource.username=springuser
spring.datasource.password=Spring@2026

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Server
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
